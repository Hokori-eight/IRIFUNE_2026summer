<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>#勝山発掘まちあるき | IRIFUNE</title>
<meta name="theme-color" content="#FFFDF3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* IRIFUNE ブランドトークン */
    --base:  #FFFDF3;  /* Template */
    --brown: #462814;  /* Dark Brown */
    --land:  #B0C8A4;  /* land */
    --sky:   #73B4C0;  /* sky */
    --sea:   #4F9282;
    --gray:  #727171;
    --stamp: #C0453C;  /* CLEAR スタンプの朱色 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--base);
    color: var(--brown);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 16px;
  }
  header { text-align: center; margin: 0 0 10px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: 0.02em; }
  .site-footer {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(70,40,20,0.14);
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--gray);
  }
  .footer-logo { width: 20px; height: 20px; object-fit: contain; mix-blend-mode: multiply; }
  .status {
    max-width: 420px;
    width: 100%;
    text-align: center;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 500;
  }
  /* 画面が低いときは盤面を縮めて、スクロールなしで収める */
  .board-wrap {
    position: relative;
    width: min(100%, 420px, calc(100vh - 268px));
    width: min(100%, 420px, calc(100dvh - 268px));
  }
  .board {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    background: var(--brown);
    padding: 6px;
    border-radius: 14px;
  }
  /* スタンプは canvas で作った画像。盤面いっぱいに重ねる */
  #stampImg {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    transform: translate(-50%, -50%) rotate(-13deg);
    pointer-events: none;
    z-index: 5;
    filter: drop-shadow(0 0 5px rgba(255,253,243,0.5));
  }
  #stampImg[hidden] { display: none; }
  #stampImg.pop { animation: stampIn 0.42s cubic-bezier(0.2, 1.5, 0.4, 1); }
  @keyframes stampIn {
    0%   { transform: translate(-50%,-50%) rotate(-13deg) scale(2.4); opacity: 0; }
    55%  { opacity: 1; }
    100% { transform: translate(-50%,-50%) rotate(-13deg) scale(1);   opacity: 1; }
  }
  .cell {
    position: relative;
    background: var(--base);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s;
  }
  .cell:active { transform: scale(0.97); }
  .cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cell .topic-text {
    position: relative;
    z-index: 1;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.45;
    padding: 8px 6px;
    white-space: pre-line;  /* お題の \n を改行として反映 */
    overflow-wrap: anywhere;
  }
  .cell.has-photo .topic-text {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 2;
    color: var(--base);
    background: linear-gradient(transparent, rgba(70,40,20,0.92));
    font-size: 10px;
    padding: 14px 4px 5px;
  }
  .cell.center { background: var(--land); }
  .cell .badge {
    position: absolute;
    top: 6px; left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    background: var(--brown);
    color: var(--base);
    font-size: 9px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .cell input.topic-input {
    position: relative;
    z-index: 2;
    width: 84%;
    margin-top: 16px;
    background: rgba(255,253,243,0.95);
    color: var(--brown);
    border: none;
    border-radius: 6px;
    padding: 6px 4px;
    font-size: 11.5px;
    font-family: inherit;
    text-align: center;
  }
  .cell.center.has-photo input.topic-input { display: none; }
  .file-input { display: none; }
  .controls { display: flex; gap: 10px; margin-top: 12px; width: 100%; max-width: 420px; }
  button {
    padding: 13px 8px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 700;
    border: none;
    border-radius: 9px;
    cursor: pointer;
  }
  #resetBtn {
    flex: 0 0 34%;
    background: transparent;
    color: var(--brown);
    box-shadow: inset 0 0 0 1.5px var(--brown);
  }
  #saveBtn { flex: 1; background: var(--sea); color: #fff; }
  #saveBtn:disabled { opacity: 0.5; }
  .hint {
    margin: 10px 0 0;
    font-size: 11px;
    line-height: 1.65;
    color: var(--gray);
    text-align: center;
    max-width: 420px;
  }
  .hint strong { color: var(--brown); font-weight: 700; }

  /* 写真を撮ったマスをタップしたときの操作シート */
  .sheet-back {
    position: fixed;
    inset: 0;
    background: rgba(70,40,20,0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .sheet-back[hidden] { display: none; }
  .sheet {
    width: 100%;
    max-width: 420px;
    background: var(--base);
    border-radius: 14px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .sheet .sheet-title {
    text-align: center;
    font-size: 12px;
    color: var(--gray);
    padding: 10px 4px 6px;
  }
  .sheet button { width: 100%; }
  .sheet .primary { background: var(--sea); color: #fff; }
  .sheet .plain   { background: transparent; color: var(--brown); box-shadow: inset 0 0 0 1.5px var(--brown); }
  .sheet .quiet   { background: transparent; color: var(--gray); font-weight: 500; }
  .sheet .sheet-note {
    text-align: center;
    font-size: 11px;
    line-height: 1.6;
    color: var(--gray);
    padding: 0 10px 8px;
    white-space: pre-line;
  }

  /* 現地判定に合格したマスの印 */
  .cell .geo-ok {
    position: absolute;
    top: 5px; right: 5px;
    z-index: 3;
    width: 17px; height: 17px;
    border-radius: 999px;
    background: var(--sea);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 座標の下見モード（?spots） */
  #survey {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: var(--base);
    padding: 16px;
    overflow: auto;
    font-size: 13px;
    line-height: 1.7;
  }
  #survey[hidden] { display: none; }
  #survey h2 { font-size: 15px; margin: 0 0 8px; }
  #survey .now { font-size: 16px; font-weight: 700; margin: 8px 0; }
  #survey select, #survey textarea {
    width: 100%;
    font-family: inherit;
    font-size: 12px;
    padding: 8px;
    border-radius: 8px;
    border: 1.5px solid var(--brown);
    background: #fff;
    color: var(--brown);
    margin: 4px 0 10px;
  }
  #survey textarea { height: 190px; white-space: pre; }
  #survey button { width: 100%; margin-bottom: 8px; }
  #survey .primary { background: var(--sea); color: #fff; }
  #survey .plain   { background: transparent; color: var(--brown); box-shadow: inset 0 0 0 1.5px var(--brown); }
  #survey .quiet   { background: transparent; color: var(--gray); font-weight: 500; }
</style>
</head>
<body>

<header>
  <h1>#勝山発掘まちあるき</h1>
</header>

<div class="status"><span id="count">0 / 9 発掘</span></div>

<div class="board-wrap">
  <div class="board" id="board"></div>
  <img id="stampImg" alt="CLEAR" hidden>
</div>

<div class="controls">
  <button id="resetBtn">リセット</button>
  <button id="saveBtn">画像を保存</button>
</div>

<p class="hint">
  マスをタップして撮影。<strong>もう一度タップ</strong>で端末に保存できます。<br>
  中央は自由に決められる<strong>発掘マス</strong>。<strong>ページを閉じると消えます。</strong>
</p>

<footer class="site-footer">
  <img src="logo.png" alt="" class="footer-logo">
  <span>まちの発掘拠点 IRIFUNE</span>
</footer>

<div class="sheet-back" id="saveBack" hidden>
  <div class="sheet">
    <div class="sheet-title">保存するものを選んでください</div>
    <button class="primary" id="saveSheetBtn">ビンゴシートを保存</button>
    <button class="plain"   id="saveAllBtn">撮った写真をまとめて保存</button>
    <button class="quiet"   id="saveCancelBtn">キャンセル</button>
  </div>
</div>

<div class="sheet-back" id="geoBack" hidden>
  <div class="sheet">
    <div class="sheet-title" id="geoTitle"></div>
    <div class="sheet-note"  id="geoNote"></div>
    <button class="primary" id="geoShootBtn" hidden>撮影する</button>
    <button class="plain"   id="geoRetryBtn" hidden>もう一度確認する</button>
    <button class="quiet"   id="geoAnywayBtn" hidden>それでも撮影する</button>
    <button class="quiet"   id="geoCancelBtn">キャンセル</button>
  </div>
</div>

<div id="survey" hidden></div>

<div class="sheet-back" id="sheetBack" hidden>
  <div class="sheet">
    <div class="sheet-title" id="sheetTitle"></div>
    <button class="primary" id="savePhotoBtn">この写真を端末に保存</button>
    <button class="plain"   id="retakeBtn">撮り直す</button>
    <button class="quiet"   id="cancelBtn">キャンセル</button>
  </div>
</div>

<script>
/* 改行したい位置に \n を入れると、その位置で必ず折り返します */
const TOPICS = [
  "大清水",
  "ダイナ荘",
  "恐竜\nマンホール",
  "消火栓モグラ",
  "恐竜ポスト",
  "七里壁",
  "入船電柱",
  "梅から生える\n松の木"
];

/* お題ごとの現地判定。TOPICS と同じ文字列をキーにして緯度・経度・許容半径(m)を入れます。
   座標が未登録のお題は判定なしで、これまで通りすぐ撮影できます。
   座標は URL の末尾に ?spots を付けて開くと、現地で記録できます。 */
const SPOTS = {
  // "大清水": { lat: 36.000000, lng: 136.000000, r: 60 },
};
const DEFAULT_RADIUS = 60;   // 許容半径のきほん値（m）
const GEO_TIMEOUT = 12000;

const CENTER_INDEX = 4;
const CENTER_LABEL = "発掘マス";
const TITLE = "#勝山発掘まちあるき";
const SUBTITLE = "まちの発掘拠点 IRIFUNE";
const LOGO_SRC = "logo.png";

/* IRIFUNE ブランドトークン（k-irifune.com と共通） */
const C = {
  base:  "#FFFDF3",
  brown: "#462814",
  land:  "#B0C8A4",
  sky:   "#73B4C0",
  sea:   "#4F9282",
  gray:  "#727171",
  stamp: "#C0453C"
};

const LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

/* cell = { topic, file: 撮影した元ファイル, photo: 表示用に縮小した dataURL, verified: 現地判定に合格したか } */
let cells = [];

/* ---------- 現地判定（位置情報は端末の中だけで使い、どこにも送りません） ---------- */

/* 2地点の距離をメートルで返す（球面近似） */
function distanceMeters(a, b) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function spotOf(cell) {
  return cell.isCenter ? null : (SPOTS[cell.topic] || null);
}

function currentPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error("unsupported")); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      err => reject(err),
      { enableHighAccuracy: true, timeout: GEO_TIMEOUT, maximumAge: 0 }
    );
  });
}

function formatDistance(m) {
  return m >= 1000 ? `${(m / 1000).toFixed(1)}km` : `${Math.round(m)}m`;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initCells() {
  const shuffled = shuffle(TOPICS);
  cells = [];
  let idx = 0;
  for (let i = 0; i < 9; i++) {
    if (i === CENTER_INDEX) {
      cells.push({ topic: "", file: null, photo: null, isCenter: true, verified: false });
    } else {
      cells.push({ topic: shuffled[idx++], file: null, photo: null, isCenter: false, verified: false });
    }
  }
}

function filledCount() { return cells.filter(c => c.photo).length; }
function bingoLines() { return LINES.filter(line => line.every(i => cells[i].photo)); }

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

/* 端末に保存する元画像はそのまま持ち、表示用だけ縮小してメモリを抑える */
async function toDisplayDataUrl(file, max = 1500) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(img, 0, 0, w, h);
    return cv.toDataURL("image/jpeg", 0.9);
  } finally {
    URL.revokeObjectURL(url);
  }
}

/* ---------- CLEAR スタンプ ---------- */

/* 掠れ具合を毎回同じにするための擬似乱数 */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

let logoMask  = null;  /* スタンプ用（朱色） */
let logoBrown = null;  /* フッター用（濃茶） */

/* 白地・濃色のロゴPNGを、明るさからアルファを起こして任意の一色に置き換える */
function tintLogo(img, r, g, b) {
  const S = 512;
  const cv = document.createElement("canvas");
  cv.width = cv.height = S;
  const x = cv.getContext("2d");
  x.drawImage(img, 0, 0, S, S);
  const d = x.getImageData(0, 0, S, S);
  const p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const lum = (p[i] * 0.299 + p[i+1] * 0.587 + p[i+2] * 0.114) / 255;
    p[i+3] = Math.round(Math.max(0, 1 - lum) * 255);
    p[i] = r; p[i+1] = g; p[i+2] = b;
  }
  x.putImageData(d, 0, 0);
  return cv;
}

/* 丸枠のインクを部分的に削って、押しムラのある枠にする（文字とロゴには触れない） */
function erodeRing(rx, S, cx, cy, r) {
  const rnd = mulberry32(20260728);
  rx.globalCompositeOperation = "destination-out";

  // 枠線の上に乗るような半径を選ぶ
  const onRing = () => (rnd() < 0.65 ? r : r * 0.885) * (0.97 + rnd() * 0.06);

  // インクの欠け
  for (let i = 0; i < 12; i++) {
    const a = rnd() * Math.PI * 2, d = onRing();
    rx.beginPath();
    rx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, S * (0.004 + rnd() * 0.009), 0, Math.PI * 2);
    rx.fill();
  }
  // 細かい擦れ
  for (let i = 0; i < 170; i++) {
    const a = rnd() * Math.PI * 2, d = onRing();
    rx.beginPath();
    rx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, S * (0.0010 + rnd() * 0.0030), 0, Math.PI * 2);
    rx.fill();
  }
  // 枠が途切れたように見える弧
  rx.lineCap = "round";
  for (let i = 0; i < 3; i++) {
    const a = rnd() * Math.PI * 2;
    const span = 0.03 + rnd() * 0.06;
    rx.lineWidth = S * (0.005 + rnd() * 0.009);
    rx.beginPath();
    rx.arc(cx, cy, rnd() < 0.65 ? r : r * 0.885, a, a + span);
    rx.stroke();
  }
  rx.globalCompositeOperation = "source-over";
}

const stampCache = new Map();

function makeStampCanvas(subText) {
  if (stampCache.has(subText)) return stampCache.get(subText);

  const S = 1400;
  const cv = document.createElement("canvas");
  cv.width = cv.height = S;
  const x = cv.getContext("2d");
  const cx = S / 2, cy = S / 2, r = S * 0.40;

  // 二重の外枠だけは別レイヤーに描き、掠れさせてから合成する
  const ring = document.createElement("canvas");
  ring.width = ring.height = S;
  const rx = ring.getContext("2d");
  rx.strokeStyle = C.stamp;
  rx.lineWidth = S * 0.030;
  rx.beginPath(); rx.arc(cx, cy, r, 0, Math.PI * 2); rx.stroke();
  rx.lineWidth = S * 0.010;
  rx.beginPath(); rx.arc(cx, cy, r * 0.885, 0, Math.PI * 2); rx.stroke();
  erodeRing(rx, S, cx, cy, r);
  x.drawImage(ring, 0, 0);

  x.strokeStyle = C.stamp;
  x.fillStyle = C.stamp;
  x.textAlign = "center";
  x.textBaseline = "middle";

  // IRIFUNE のシンボルマーク
  if (logoMask) {
    const lw = S * 0.30, lh = lw;
    x.drawImage(logoMask, cx - lw / 2, cy - S * 0.245 - lh / 2, lw, lh);
  }

  x.font = `700 ${Math.round(S * 0.185)}px Inter, "Noto Sans JP", sans-serif`;
  x.fillText("CLEAR!", cx, cy + S * 0.045);

  // 区切り線
  x.lineWidth = S * 0.006;
  x.beginPath();
  x.moveTo(cx - S * 0.15, cy + S * 0.145);
  x.lineTo(cx + S * 0.15, cy + S * 0.145);
  x.stroke();

  x.font = `700 ${Math.round(S * 0.055)}px Inter, "Noto Sans JP", sans-serif`;
  x.fillText(subText, cx, cy + S * 0.205);

  stampCache.set(subText, cv);
  return cv;
}

function stampSubText(lines, n) {
  if (n === 9) return "コンプリート";
  return lines > 1 ? `${lines} LINES` : "BINGO";
}

/* ---------- 表示 ---------- */

let prevBingo = 0;

function updateStatus() {
  const n = filledCount();
  document.getElementById("count").textContent = `${n} / 9 発掘`;

  const lines = bingoLines().length;
  const stamp = document.getElementById("stampImg");
  if (lines > 0) {
    stamp.src = makeStampCanvas(stampSubText(lines, n)).toDataURL("image/png");
    stamp.hidden = false;
    if (lines > prevBingo) {
      stamp.classList.remove("pop");
      void stamp.offsetWidth;  // アニメを頭から再生させるためリフローを挟む
      stamp.classList.add("pop");
    }
  } else {
    stamp.hidden = true;
    stamp.classList.remove("pop");
  }
  prevBingo = lines;
}

function render() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  cells.forEach((cell, index) => {
    const div = document.createElement("div");
    div.className = "cell" + (cell.isCenter ? " center" : "") + (cell.photo ? " has-photo" : "");

    if (cell.photo) {
      const img = document.createElement("img");
      img.src = cell.photo;
      div.appendChild(img);
    }

    if (cell.verified && cell.photo) {
      const ok = document.createElement("div");
      ok.className = "geo-ok";
      ok.textContent = "✓";
      ok.title = "現地で撮影";
      div.appendChild(ok);
    }

    if (cell.isCenter) {
      const badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = CENTER_LABEL;
      div.appendChild(badge);
    }

    if (cell.isCenter && !cell.photo) {
      const input = document.createElement("input");
      input.className = "topic-input";
      input.type = "text";
      input.placeholder = "発掘したもの";
      input.value = cell.topic;
      input.addEventListener("click", (e) => e.stopPropagation());
      input.addEventListener("input", (e) => { cell.topic = e.target.value; });
      div.appendChild(input);
    } else {
      const label = document.createElement("div");
      label.className = "topic-text";
      label.textContent = cell.topic;
      div.appendChild(label);
    }

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.capture = "environment";
    fileInput.className = "file-input";
    // プログラムから click() したとき、マス自身の click に跳ね返らないようにする
    fileInput.addEventListener("click", (e) => e.stopPropagation());
    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      cell.file = file;
      cell.photo = await toDisplayDataUrl(file);
      render();
    });
    div.appendChild(fileInput);

    // 写真がまだなら撮影へ、あるなら保存/撮り直しの選択へ。
    // 座標が登録されたお題は、先に現地かどうかを確かめる
    div.addEventListener("click", () => {
      if (cell.photo) openSheet(index);
      else if (spotOf(cell)) startGeoCheck(index);
      else fileInput.click();
    });
    div._fileInput = fileInput;

    board.appendChild(div);
  });
  updateStatus();
}

/* ---------- 現地判定ダイアログ ---------- */

let geoIndex = null;
let geoPassed = false;

function setGeoButtons(shoot, retry, anyway) {
  document.getElementById("geoShootBtn").hidden  = !shoot;
  document.getElementById("geoRetryBtn").hidden  = !retry;
  document.getElementById("geoAnywayBtn").hidden = !anyway;
}

function closeGeo() {
  document.getElementById("geoBack").hidden = true;
  geoIndex = null;
}

function openCameraFor(index) {
  const div = document.getElementById("board").children[index];
  if (div && div._fileInput) div._fileInput.click();
}

async function runGeoCheck() {
  const index = geoIndex;
  const cell = cells[index];
  const spot = spotOf(cell);
  const name = cell.topic.replace(/\n/g, "");
  const title = document.getElementById("geoTitle");
  const note  = document.getElementById("geoNote");

  geoPassed = false;
  title.textContent = `${name} … 現在地を確認しています`;
  note.textContent = "屋外のほうが正確に測れます。";
  setGeoButtons(false, false, false);

  let pos;
  try {
    pos = await currentPosition();
  } catch (err) {
    if (geoIndex !== index) return;   // 待っている間に閉じられた
    title.textContent = "現在地を取得できませんでした";
    note.textContent = (err && err.code === 1)
      ? "位置情報の利用が許可されていません。\nブラウザの設定で許可すると、現地判定ができます。"
      : "電波や建物の影響かもしれません。\n少し場所を移して、もう一度お試しください。";
    setGeoButtons(false, true, true);
    return;
  }
  if (geoIndex !== index) return;

  const dist   = distanceMeters(pos, spot);
  const radius = spot.r || DEFAULT_RADIUS;
  // GPS の誤差ぶんは大目に見る。ただし誤差が大きすぎるときは 80m で頭打ちにする
  const margin = Math.min(pos.acc || 0, 80);

  if (dist - margin <= radius) {
    geoPassed = true;
    title.textContent = `正解！ ${name} に到着しました`;
    note.textContent  = `目標まで約 ${formatDistance(dist)}`;
    setGeoButtons(true, false, false);
  } else {
    title.textContent = `まだ ${name} まで届いていません`;
    note.textContent  = `あと約 ${formatDistance(dist - radius)}。\n近づいたら、もう一度確認してください。`;
    setGeoButtons(false, true, true);
  }
}

function startGeoCheck(index) {
  geoIndex = index;
  document.getElementById("geoBack").hidden = false;
  runGeoCheck();
}

/* 撮影は必ずボタンのタップから始める（iOS はユーザー操作なしにカメラを開けない） */
function shootFromGeo() {
  const i = geoIndex;
  if (geoPassed) cells[i].verified = true;
  closeGeo();
  openCameraFor(i);
}

document.getElementById("geoShootBtn").addEventListener("click", shootFromGeo);
document.getElementById("geoAnywayBtn").addEventListener("click", shootFromGeo);
document.getElementById("geoRetryBtn").addEventListener("click", runGeoCheck);
document.getElementById("geoCancelBtn").addEventListener("click", closeGeo);
document.getElementById("geoBack").addEventListener("click", (e) => {
  if (e.target.id === "geoBack") closeGeo();
});

/* 共有シート経由で端末に保存する。非対応環境ではダウンロードにする */
async function saveFileToDevice(file, fallbackName) {
  const data = { files: [file] };
  if (navigator.canShare && navigator.canShare(data)) {
    await navigator.share(data);
    return;
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url;
  a.download = fallbackName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.getElementById("savePhotoBtn").addEventListener("click", async () => {
  const cell = cells[sheetIndex];
  const label = (cell.topic || CENTER_LABEL).replace(/\n/g, "");
  closeSheet();
  if (!cell.file) return;
  try {
    await saveFileToDevice(cell.file, `katsuyama-${label}.jpg`);
  } catch (err) {
    if (err && err.name !== "AbortError") alert("保存できませんでした。もう一度お試しください。");
  }
});

/* ---------- 保存用のシート画像 ---------- */

function roundRectPath(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* \n で必ず改行し、それでも幅に収まらない行だけ文字単位で折り返す */
function wrapLines(ctx, text, maxWidth) {
  const lines = [];
  for (const segment of text.split("\n")) {
    let line = "";
    for (const ch of segment.split("")) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    lines.push(line);
  }
  return lines;
}

function drawCenteredText(ctx, text, cx, cy, maxWidth, lineHeight) {
  if (!text) return;
  const lines = wrapLines(ctx, text, maxWidth);
  const startY = cy - (lines.length * lineHeight) / 2 + lineHeight / 2;
  lines.forEach((l, i) => ctx.fillText(l, cx, startY + i * lineHeight));
}

function drawPhotoCover(ctx, img, x, y, w, h) {
  const imgRatio = img.width / img.height;
  const boxRatio = w / h;
  let sx, sy, sw, sh;
  if (imgRatio > boxRatio) {
    sh = img.height; sw = sh * boxRatio; sx = (img.width - sw) / 2; sy = 0;
  } else {
    sw = img.width; sh = sw / boxRatio; sx = 0; sy = (img.height - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

async function buildImage() {
  await document.fonts.load('700 54px "Noto Sans JP"');
  await document.fonts.load('500 26px "Noto Sans JP"');
  await document.fonts.ready;

  const W = 1620;            // 1マスあたり約520px
  const k = W / 1080;        // 従来比の拡大率
  const PAD = 44 * k;
  const GAP = 12 * k;
  const HEADER = 186 * k;
  const FOOTER = 156 * k;
  const grid = W - PAD * 2;
  const box = (grid - GAP * 2) / 3;
  const H = Math.round(HEADER + grid + FOOTER);

  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = C.base;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // ヘッダー
  ctx.fillStyle = C.brown;
  ctx.font = `700 ${54 * k}px Inter, "Noto Sans JP", sans-serif`;
  ctx.fillText(TITLE, W / 2, 74 * k);

  // 進捗バッジ（CLEAR はスタンプで示すので、ここは発掘数だけ）
  const n = filledCount();
  const lines = bingoLines().length;
  const statusText = `${n} / 9 発掘`;
  ctx.font = `700 ${26 * k}px Inter, "Noto Sans JP", sans-serif`;
  const bw = ctx.measureText(statusText).width + 46 * k;
  const bh = 44 * k, bx = (W - bw) / 2, by = 134 * k;
  ctx.fillStyle = C.land;
  roundRectPath(ctx, bx, by, bw, bh, bh / 2);
  ctx.fill();
  ctx.fillStyle = C.brown;
  ctx.fillText(statusText, W / 2, by + bh / 2 + 1);

  // 盤面の下地
  ctx.fillStyle = C.brown;
  roundRectPath(ctx, PAD - 9 * k, HEADER - 9 * k, grid + 18 * k, grid + 18 * k, 20 * k);
  ctx.fill();

  const imgs = await Promise.all(cells.map(c => c.photo ? loadImage(c.photo) : null));

  cells.forEach((cell, i) => {
    const x = PAD + (i % 3) * (box + GAP);
    const y = HEADER + Math.floor(i / 3) * (box + GAP);
    const img = imgs[i];

    ctx.save();
    roundRectPath(ctx, x, y, box, box, 12 * k);
    ctx.clip();

    if (img) {
      drawPhotoCover(ctx, img, x, y, box, box);
      const bandH = 64 * k;
      const grad = ctx.createLinearGradient(0, y + box - bandH, 0, y + box);
      grad.addColorStop(0, "rgba(70,40,20,0)");
      grad.addColorStop(1, "rgba(70,40,20,0.93)");
      ctx.fillStyle = grad;
      ctx.fillRect(x, y + box - bandH, box, bandH);
      ctx.fillStyle = C.base;
      ctx.font = `500 ${21 * k}px Inter, "Noto Sans JP", sans-serif`;
      drawCenteredText(ctx, cell.topic || CENTER_LABEL, x + box / 2, y + box - 26 * k, box - 20 * k, 24 * k);
    } else {
      ctx.fillStyle = cell.isCenter ? C.land : C.base;
      ctx.fillRect(x, y, box, box);
      ctx.fillStyle = C.brown;
      ctx.font = `500 ${26 * k}px Inter, "Noto Sans JP", sans-serif`;
      drawCenteredText(ctx, cell.topic || (cell.isCenter ? CENTER_LABEL : ""), x + box / 2, y + box / 2, box - 34 * k, 34 * k);
    }
    ctx.restore();
  });

  // ビンゴ成立時は盤面いっぱいに CLEAR スタンプ
  if (lines > 0) {
    const stamp = makeStampCanvas(stampSubText(lines, n));
    const size = grid * 1.04;
    ctx.save();
    ctx.translate(W / 2, HEADER + grid / 2);
    ctx.rotate(-13 * Math.PI / 180);
    ctx.globalAlpha = 0.92;
    ctx.drawImage(stamp, -size / 2, -size / 2, size, size);
    ctx.restore();
  }

  // フッター（ハッシュタグはタイトルと重複するので置かない）
  const d = new Date();
  const dateStr = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
  const fy = HEADER + grid;

  ctx.fillStyle = C.gray;
  ctx.font = `500 ${23 * k}px Inter, "Noto Sans JP", sans-serif`;
  ctx.fillText(`${dateStr}　福井県勝山市`, W / 2, fy + 50 * k);

  // ロゴ＋ハウスネームを最下部に置く
  ctx.fillStyle = C.brown;
  ctx.font = `500 ${24 * k}px Inter, "Noto Sans JP", sans-serif`;
  const houseText = SUBTITLE;
  const logoSize = 34 * k;
  const textW = ctx.measureText(houseText).width;
  const totalW = (logoBrown ? logoSize + 12 * k : 0) + textW;
  const startX = (W - totalW) / 2;
  const houseY = fy + 108 * k;
  if (logoBrown) {
    ctx.drawImage(logoBrown, startX, houseY - logoSize / 2, logoSize, logoSize);
  }
  ctx.textAlign = "left";
  ctx.fillText(houseText, startX + (logoBrown ? logoSize + 12 * k : 0), houseY);
  ctx.textAlign = "center";

  return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.92));
}

/* 保存メニュー */

function photoLabel(cell) {
  return (cell.topic || CENTER_LABEL).replace(/\n/g, "");
}

document.getElementById("saveBtn").addEventListener("click", () => {
  const shot = cells.filter(c => c.file).length;
  const allBtn = document.getElementById("saveAllBtn");
  allBtn.textContent = `撮った写真をまとめて保存（${shot}枚）`;
  allBtn.disabled = shot === 0;
  allBtn.style.opacity = shot === 0 ? 0.4 : 1;
  document.getElementById("saveBack").hidden = false;
});

function closeSaveMenu() { document.getElementById("saveBack").hidden = true; }
document.getElementById("saveCancelBtn").addEventListener("click", closeSaveMenu);
document.getElementById("saveBack").addEventListener("click", (e) => {
  if (e.target.id === "saveBack") closeSaveMenu();
});

/* 撮影した元画像をまとめて共有シートへ渡す */
document.getElementById("saveAllBtn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  const files = cells
    .filter(c => c.file)
    .map(c => new File([c.file], `katsuyama-${photoLabel(c)}.jpg`, { type: c.file.type || "image/jpeg" }));
  if (!files.length) return;

  closeSaveMenu();
  try {
    const data = { files };
    if (navigator.canShare && navigator.canShare(data)) {
      await navigator.share(data);
      return;
    }
    // 共有APIが使えない環境では1枚ずつダウンロードする
    for (const f of files) {
      const url = URL.createObjectURL(f);
      const a = document.createElement("a");
      a.href = url;
      a.download = f.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      await new Promise(r => setTimeout(r, 300));
    }
  } catch (err) {
    if (err && err.name !== "AbortError") alert("保存できませんでした。もう一度お試しください。");
  }
});

document.getElementById("saveSheetBtn").addEventListener("click", async () => {
  const btn = document.getElementById("saveBtn");
  const original = btn.textContent;
  closeSaveMenu();
  btn.disabled = true;
  btn.textContent = "作成中...";
  try {
    const blob = await buildImage();
    const file = new File([blob], "katsuyama-hakkutsu.jpg", { type: "image/jpeg" });
    const shareData = { files: [file], text: `勝山のまちを発掘してきた！\n${TITLE} #IRIFUNE #福井県勝山市` };
    if (navigator.canShare && navigator.canShare(shareData)) {
      await navigator.share(shareData);
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.download = "katsuyama-hakkutsu.jpg";
      a.href = url;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  } catch (err) {
    if (err && err.name !== "AbortError") alert("画像の保存に失敗しました。もう一度お試しください。");
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("お題をシャッフルして写真をすべて消去します。よろしいですか？")) {
    initCells();
    render();
  }
});

/* ---------- 座標の下見モード（URL の末尾に ?spots を付けると開く） ----------
   現地に立って「この地点を記録」を押すと、SPOTS に貼り付けるコードができあがります。 */
function startSurvey() {
  const panel = document.getElementById("survey");
  panel.hidden = false;
  panel.innerHTML =
    '<h2>座標の下見モード</h2>' +
    '<p>お題の場所に立って「この地点を記録」を押してください。' +
    'できあがったコードを index.html の <code>SPOTS</code> に貼り付けます。</p>' +
    '<div class="now" id="svNow">現在地を取得中…</div>' +
    '<select id="svSel"></select>' +
    '<button class="primary" id="svRec">この地点を記録</button>' +
    '<textarea id="svOut" readonly></textarea>' +
    '<button class="plain" id="svCopy">コードをコピー</button>' +
    '<button class="quiet" id="svClose">ビンゴに戻る</button>';

  const sel = document.getElementById("svSel");
  TOPICS.forEach(t => {
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t.replace(/\n/g, "");
    sel.appendChild(o);
  });

  let here = null;
  const recorded = {};

  const paint = () => {
    const rows = Object.keys(recorded).map(t =>
      `  ${JSON.stringify(t)}: { lat: ${recorded[t].lat.toFixed(6)}, ` +
      `lng: ${recorded[t].lng.toFixed(6)}, r: ${DEFAULT_RADIUS} },`
    );
    document.getElementById("svOut").value =
      "const SPOTS = {" + (rows.length ? "\n" + rows.join("\n") + "\n" : "") + "};";
  };
  paint();

  navigator.geolocation.watchPosition(p => {
    here = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
    document.getElementById("svNow").textContent =
      `${here.lat.toFixed(6)}, ${here.lng.toFixed(6)}（誤差 約${Math.round(here.acc)}m）`;
  }, err => {
    document.getElementById("svNow").textContent = `取得できません（${err.message}）`;
  }, { enableHighAccuracy: true, maximumAge: 0 });

  document.getElementById("svRec").addEventListener("click", () => {
    if (!here) { alert("まだ現在地を取得できていません。"); return; }
    recorded[sel.value] = here;
    paint();
  });
  document.getElementById("svCopy").addEventListener("click", async () => {
    const text = document.getElementById("svOut").value;
    try { await navigator.clipboard.writeText(text); alert("コピーしました。"); }
    catch { alert("コピーできませんでした。手動で選択してください。"); }
  });
  document.getElementById("svClose").addEventListener("click", () => { panel.hidden = true; });
}

initCells();
render();

if (location.search.includes("spots")) startSurvey();

// ロゴとフォントが揃った時点でスタンプを作り直す
loadImage(LOGO_SRC).then(img => {
  logoMask  = tintLogo(img, 0xC0, 0x45, 0x3C);
  logoBrown = tintLogo(img, 0x46, 0x28, 0x14);
  stampCache.clear();
  updateStatus();
}).catch(() => { /* ロゴが無くてもスタンプとフッターは成立する */ });

document.fonts.ready.then(() => {
  stampCache.clear();
  updateStatus();
});
