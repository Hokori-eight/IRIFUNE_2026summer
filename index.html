<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>#勝山発掘まちあるき | IRIFUNE</title>
<meta name="theme-color" content="#FFFDF3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* IRIFUNE ブランドトークン */
    --base:  #FFFDF3;  /* Template */
    --brown: #462814;  /* Dark Brown */
    --land:  #B0C8A4;  /* land */
    --sky:   #73B4C0;  /* sky */
    --sea:   #4F9282;
    --gray:  #727171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--base);
    color: var(--brown);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 16px 32px;
  }
  header { text-align: center; margin: 2px 0 16px; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .sub {
    font-size: 11px;
    color: var(--gray);
    margin-top: 6px;
    letter-spacing: 0.14em;
  }
  .status {
    max-width: 420px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 13px;
    font-weight: 500;
  }
  .status .bingo {
    background: var(--sea);
    color: #fff;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 12px;
  }
  .board {
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    background: var(--brown);
    padding: 6px;
    border-radius: 14px;
  }
  .cell {
    position: relative;
    background: var(--base);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s;
  }
  .cell:active { transform: scale(0.97); }
  .cell img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .cell .topic-text {
    position: relative;
    z-index: 1;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.45;
    padding: 8px 6px;
    word-break: break-word;
  }
  .cell.has-photo .topic-text {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    color: var(--base);
    background: linear-gradient(transparent, rgba(70,40,20,0.92));
    font-size: 10px;
    padding: 14px 4px 5px;
  }
  .cell.center { background: var(--land); }
  .cell .badge {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    background: var(--brown);
    color: var(--base);
    font-size: 9px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .cell input.topic-input {
    position: relative;
    z-index: 2;
    width: 84%;
    margin-top: 16px;
    background: rgba(255,253,243,0.95);
    color: var(--brown);
    border: none;
    border-radius: 6px;
    padding: 6px 4px;
    font-size: 11.5px;
    font-family: inherit;
    text-align: center;
  }
  .cell.center.has-photo input.topic-input { display: none; }
  .file-input { display: none; }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    width: 100%;
    max-width: 420px;
  }
  button {
    padding: 13px 8px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 700;
    border: none;
    border-radius: 9px;
    cursor: pointer;
  }
  #resetBtn {
    flex: 0 0 34%;
    background: transparent;
    color: var(--brown);
    box-shadow: inset 0 0 0 1.5px var(--brown);
  }
  #saveBtn {
    flex: 1;
    background: var(--sea);
    color: #fff;
  }
  #saveBtn:disabled { opacity: 0.5; }
  .hint {
    margin-top: 16px;
    font-size: 11.5px;
    line-height: 1.8;
    color: var(--gray);
    text-align: center;
    max-width: 420px;
  }
  .hint strong { color: var(--brown); font-weight: 700; }
</style>
</head>
<body>

<header>
  <h1>#勝山発掘まちあるき</h1>
  <div class="sub">まちの発掘拠点 IRIFUNE</div>
</header>

<div class="status">
  <span id="count">0 / 9 発掘</span>
  <span class="bingo" id="bingoBadge" style="display:none">BINGO!</span>
</div>

<div class="board" id="board"></div>

<div class="controls">
  <button id="resetBtn">リセット</button>
  <button id="saveBtn">画像を保存</button>
</div>

<p class="hint">
  マスをタップして写真を撮ろう。中央は自由に決められる<strong>発掘マス</strong>。<br>
  <strong>ページを閉じると消えます。</strong>完成したら必ず保存してね。
</p>

<script>
const TOPICS = [
  "大清水",
  "ダイナ荘",
  "恐竜マンホール",
  "消火栓モグラ",
  "恐竜ポスト",
  "七里壁",
  "入船電柱",
  "梅から生える松の木"
];

const CENTER_INDEX = 4;
const CENTER_LABEL = "発掘マス";
const TITLE = "#勝山発掘まちあるき";
const SUBTITLE = "まちの発掘拠点 IRIFUNE";

/* IRIFUNE ブランドトークン（k-irifune.com と共通） */
const C = {
  base:  "#FFFDF3",
  brown: "#462814",
  land:  "#B0C8A4",
  sky:   "#73B4C0",
  sea:   "#4F9282",
  gray:  "#727171"
};

const LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

let cells = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initCells() {
  const shuffled = shuffle(TOPICS);
  cells = [];
  let idx = 0;
  for (let i = 0; i < 9; i++) {
    if (i === CENTER_INDEX) {
      cells.push({ topic: "", photo: null, isCenter: true });
    } else {
      cells.push({ topic: shuffled[idx++], photo: null, isCenter: false });
    }
  }
}

function filledCount() {
  return cells.filter(c => c.photo).length;
}

function bingoLines() {
  return LINES.filter(line => line.every(i => cells[i].photo));
}

function updateStatus() {
  const n = filledCount();
  document.getElementById("count").textContent = `${n} / 9 発掘`;
  const lines = bingoLines().length;
  const badge = document.getElementById("bingoBadge");
  if (lines > 0) {
    badge.style.display = "";
    badge.textContent = n === 9 ? "コンプリート!" : (lines > 1 ? `${lines}ライン BINGO!` : "BINGO!");
  } else {
    badge.style.display = "none";
  }
}

function render() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  cells.forEach((cell) => {
    const div = document.createElement("div");
    div.className = "cell" + (cell.isCenter ? " center" : "") + (cell.photo ? " has-photo" : "");

    if (cell.photo) {
      const img = document.createElement("img");
      img.src = cell.photo;
      div.appendChild(img);
    }

    if (cell.isCenter) {
      const badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = CENTER_LABEL;
      div.appendChild(badge);
    }

    if (cell.isCenter && !cell.photo) {
      const input = document.createElement("input");
      input.className = "topic-input";
      input.type = "text";
      input.placeholder = "発掘したもの";
      input.value = cell.topic;
      input.addEventListener("click", (e) => e.stopPropagation());
      input.addEventListener("input", (e) => { cell.topic = e.target.value; });
      div.appendChild(input);
    } else {
      const label = document.createElement("div");
      label.className = "topic-text";
      label.textContent = cell.topic;
      div.appendChild(label);
    }

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.capture = "environment";
    fileInput.className = "file-input";
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        cell.photo = ev.target.result;
        render();
      };
      reader.readAsDataURL(file);
    });
    div.appendChild(fileInput);

    div.addEventListener("click", () => fileInput.click());
    board.appendChild(div);
  });
  updateStatus();
}

/* ---------- 保存用画像の生成 ---------- */

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundRectPath(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapLines(ctx, text, maxWidth) {
  const lines = [];
  let line = "";
  for (const ch of text.split("")) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawCenteredText(ctx, text, cx, cy, maxWidth, lineHeight) {
  if (!text) return;
  const lines = wrapLines(ctx, text, maxWidth);
  const startY = cy - (lines.length * lineHeight) / 2 + lineHeight / 2;
  lines.forEach((l, i) => ctx.fillText(l, cx, startY + i * lineHeight));
}

function drawPhotoCover(ctx, img, x, y, w, h) {
  const imgRatio = img.width / img.height;
  const boxRatio = w / h;
  let sx, sy, sw, sh;
  if (imgRatio > boxRatio) {
    sh = img.height; sw = sh * boxRatio; sx = (img.width - sw) / 2; sy = 0;
  } else {
    sw = img.width; sh = sw / boxRatio; sx = 0; sy = (img.height - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

async function buildImage() {
  await document.fonts.load('700 54px "Noto Sans JP"');
  await document.fonts.load('500 26px "Noto Sans JP"');
  await document.fonts.ready;

  const W = 1080;
  const PAD = 44;
  const GAP = 12;
  const HEADER = 186;
  const FOOTER = 128;
  const grid = W - PAD * 2;
  const box = (grid - GAP * 2) / 3;
  const H = HEADER + grid + FOOTER;

  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = C.base;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // ヘッダー
  ctx.fillStyle = C.brown;
  ctx.font = '700 54px Inter, "Noto Sans JP", sans-serif';
  ctx.fillText(TITLE, W / 2, 62);

  ctx.fillStyle = C.gray;
  ctx.font = '500 23px Inter, "Noto Sans JP", sans-serif';
  ctx.fillText(SUBTITLE, W / 2, 110);

  // 進捗バッジ
  const n = filledCount();
  const lines = bingoLines().length;
  let statusText = `${n} / 9 発掘`;
  if (n === 9) statusText += "  ・  コンプリート!";
  else if (lines > 0) statusText += `  ・  ${lines}ライン BINGO!`;

  ctx.font = '700 26px Inter, "Noto Sans JP", sans-serif';
  const tw = ctx.measureText(statusText).width;
  const bw = tw + 46, bh = 44, bx = (W - bw) / 2, by = 134;
  ctx.fillStyle = lines > 0 ? C.sea : C.land;
  roundRectPath(ctx, bx, by, bw, bh, bh / 2);
  ctx.fill();
  ctx.fillStyle = lines > 0 ? "#FFFFFF" : C.brown;
  ctx.fillText(statusText, W / 2, by + bh / 2 + 1);

  // 盤面の下地
  ctx.fillStyle = C.brown;
  roundRectPath(ctx, PAD - 9, HEADER - 9, grid + 18, grid + 18, 20);
  ctx.fill();

  const imgs = await Promise.all(cells.map(c => c.photo ? loadImage(c.photo) : null));

  cells.forEach((cell, i) => {
    const x = PAD + (i % 3) * (box + GAP);
    const y = HEADER + Math.floor(i / 3) * (box + GAP);
    const img = imgs[i];

    ctx.save();
    roundRectPath(ctx, x, y, box, box, 12);
    ctx.clip();

    if (img) {
      drawPhotoCover(ctx, img, x, y, box, box);
      const bandH = 64;
      const grad = ctx.createLinearGradient(0, y + box - bandH, 0, y + box);
      grad.addColorStop(0, "rgba(70,40,20,0)");
      grad.addColorStop(1, "rgba(70,40,20,0.93)");
      ctx.fillStyle = grad;
      ctx.fillRect(x, y + box - bandH, box, bandH);
      ctx.fillStyle = C.base;
      ctx.font = '500 21px Inter, "Noto Sans JP", sans-serif';
      drawCenteredText(ctx, cell.topic || CENTER_LABEL, x + box / 2, y + box - 26, box - 20, 24);
    } else {
      ctx.fillStyle = cell.isCenter ? C.land : C.base;
      ctx.fillRect(x, y, box, box);
      ctx.fillStyle = C.brown;
      ctx.font = '500 26px Inter, "Noto Sans JP", sans-serif';
      drawCenteredText(ctx, cell.topic || (cell.isCenter ? CENTER_LABEL : ""), x + box / 2, y + box / 2, box - 34, 34);
    }
    ctx.restore();
  });

  // フッター
  const d = new Date();
  const dateStr = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
  ctx.fillStyle = C.brown;
  ctx.font = '700 32px Inter, "Noto Sans JP", sans-serif';
  ctx.fillText(TITLE, W / 2, HEADER + grid + 52);
  ctx.fillStyle = C.gray;
  ctx.font = '500 23px Inter, "Noto Sans JP", sans-serif';
  ctx.fillText(`${dateStr}　福井県勝山市`, W / 2, HEADER + grid + 92);

  return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
}

/* ---------- 保存 / 共有 ---------- */

document.getElementById("saveBtn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "作成中...";
  try {
    const blob = await buildImage();
    const file = new File([blob], "katsuyama-hakkutsu.png", { type: "image/png" });
    const shareData = {
      files: [file],
      text: `勝山のまちを発掘してきた！\n${TITLE} #IRIFUNE #福井県勝山市`
    };
    if (navigator.canShare && navigator.canShare(shareData)) {
      await navigator.share(shareData);
    } else {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.download = "katsuyama-hakkutsu.png";
      link.href = url;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  } catch (err) {
    if (err && err.name !== "AbortError") {
      alert("画像の保存に失敗しました。もう一度お試しください。");
    }
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("お題をシャッフルして写真をすべて消去します。よろしいですか？")) {
    initCells();
    render();
  }
});

initCells();
render();
</script>

</body>
</html>
