<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>#勝山発掘まちあるき | IRIFUNE</title>
<meta name="theme-color" content="#FFFDF3">
<style>
  :root {
    /* IRIFUNE ブランドトークン */
    --base:  #FFFDF3;  /* Template */
    --brown: #462814;  /* Dark Brown */
    --land:  #B0C8A4;  /* land */
    --sky:   #73B4C0;  /* sky */
    --sea:   #4F9282;
    --gray:  #727171;
    --stamp: #C0453C;  /* CLEAR スタンプの朱色 */

    /* 端末に入っているフォントだけを使う。取りに行かないので、
       電波の弱い路地でも文字が崩れず、外部への通信も発生しません。
       （JS の FONT_STACK も同じ並びにしてください） */
    --ui-font: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
               "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic",
               "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--ui-font);
    background: var(--base);
    color: var(--brown);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 14px;
  }
  header { text-align: center; margin: 0 0 8px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: 0.02em; }
  .site-footer {
    margin-top: 9px;
    padding-top: 8px;
    border-top: 1px solid rgba(70,40,20,0.14);
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--gray);
  }
  .footer-logo { width: 20px; height: 20px; object-fit: contain; mix-blend-mode: multiply; }
  .status {
    max-width: 420px;
    width: 100%;
    text-align: center;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 500;
  }
  /* 画面が低いときは盤面を縮めて、スクロールなしで収める */
  /* マスの縦横比。ここを変えると画面も保存画像も一緒に変わります
     （保存画像側は JS の CELL_RATIO も同じ値にしてください） */
  .board-wrap {
    --cell-w: 3;
    --cell-h: 4;
    position: relative;
    /* 盤面いがい（見出し・ボタン・注記・フッター）が縦に使う量を差し引いて、
       残りいっぱいまで盤面を広げる。差し引く値は実測に合わせてあります。
       ただし 230px より縮めると、お題が読めなくなるのでそこで止める */
    width: min(100%, 420px, max(230px, calc((100vh - 242px) * var(--cell-w) / var(--cell-h))));
    width: min(100%, 420px, max(230px, calc((100dvh - 242px) * var(--cell-w) / var(--cell-h))));
  }
  .board {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--brown);
    padding: 6px;
    border-radius: 14px;
  }
  /* ビンゴの合図。写真を隠さないよう、盤面の外に文字だけで出す */
  #bingoTag {
    color: var(--stamp);
    font-weight: 700;
    margin-left: 8px;
  }
  #bingoTag[hidden] { display: none; }
  #bingoTag.pop { animation: tagIn 0.4s cubic-bezier(0.2, 1.5, 0.4, 1); display: inline-block; }
  @keyframes tagIn {
    0%   { transform: scale(2.2); opacity: 0; }
    55%  { opacity: 1; }
    100% { transform: scale(1);   opacity: 1; }
  }
  .cell {
    position: relative;
    aspect-ratio: var(--cell-w) / var(--cell-h);
    background: var(--base);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s;
  }
  .cell:active { transform: scale(0.97); }
  .cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cell .topic-text {
    position: relative;
    z-index: 1;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.45;
    padding: 8px 6px;
    white-space: pre-line;  /* お題の \n を改行として反映 */
    overflow-wrap: anywhere;
  }
  .cell.has-photo .topic-text {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 2;
    color: var(--base);
    background: linear-gradient(transparent, rgba(70,40,20,0.92));
    font-size: 10px;
    padding: 14px 4px 5px;
  }
  .cell.center { background: var(--land); }
  .cell .badge {
    position: absolute;
    top: 6px; left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    background: var(--brown);
    color: var(--base);
    font-size: 9px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .cell input.topic-input {
    position: relative;
    z-index: 2;
    width: 84%;
    margin-top: 16px;
    background: rgba(255,253,243,0.95);
    color: var(--brown);
    border: none;
    border-radius: 6px;
    padding: 6px 4px;
    font-size: 11.5px;
    font-family: inherit;
    text-align: center;
  }
  .cell.center.has-photo input.topic-input { display: none; }
  .file-input { display: none; }
  .controls { display: flex; gap: 10px; margin-top: 10px; width: 100%; max-width: 420px; }
  button {
    padding: 13px 8px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 700;
    border: none;
    border-radius: 9px;
    cursor: pointer;
  }
  #resetBtn {
    flex: 0 0 34%;
    background: transparent;
    color: var(--brown);
    box-shadow: inset 0 0 0 1.5px var(--brown);
  }
  #saveBtn { flex: 1; background: var(--sea); color: #fff; }
  #saveBtn:disabled { opacity: 0.5; }
  .hint {
    margin: 8px 0 0;
    font-size: 11px;
    line-height: 1.65;
    color: var(--gray);
    text-align: center;
    max-width: 420px;
  }
  .hint strong { color: var(--brown); font-weight: 700; }

  /* 写真を撮ったマスをタップしたときの操作シート */
  .sheet-back {
    position: fixed;
    inset: 0;
    background: rgba(70,40,20,0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .sheet-back[hidden] { display: none; }
  .sheet {
    width: 100%;
    max-width: 420px;
    background: var(--base);
    border-radius: 14px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .sheet .sheet-title {
    text-align: center;
    font-size: 12px;
    color: var(--gray);
    padding: 10px 4px 6px;
  }
  .sheet button { width: 100%; }
  .sheet .primary { background: var(--sea); color: #fff; }
  .sheet .plain   { background: transparent; color: var(--brown); box-shadow: inset 0 0 0 1.5px var(--brown); }
  .sheet .quiet   { background: transparent; color: var(--gray); font-weight: 500; }
  .sheet .sheet-note {
    text-align: center;
    font-size: 11px;
    line-height: 1.6;
    color: var(--gray);
    padding: 0 10px 8px;
    white-space: pre-line;
  }
  /* 現地判定の見出しだけは、探検の手応えが出るよう大きく出す */
  #geoTitle, #introTitle {
    font-size: 17px;
    font-weight: 700;
    color: var(--brown);
    letter-spacing: 0.02em;
    padding: 14px 4px 8px;
  }
  #geoTitle .hit { color: var(--stamp); }

  /* 現地判定に合格したマスの印 */
  .cell .geo-ok {
    position: absolute;
    top: 5px; right: 5px;
    z-index: 3;
    width: 17px; height: 17px;
    border-radius: 999px;
    background: var(--sea);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 座標の下見モード（?spots） */
  #survey {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: var(--base);
    padding: 16px;
    overflow: auto;
    font-size: 13px;
    line-height: 1.7;
  }
  #survey[hidden] { display: none; }
  #survey h2 { font-size: 15px; margin: 0 0 8px; }
  #survey .now { font-size: 16px; font-weight: 700; margin: 8px 0; }
  #survey select, #survey textarea {
    width: 100%;
    font-family: inherit;
    font-size: 12px;
    padding: 8px;
    border-radius: 8px;
    border: 1.5px solid var(--brown);
    background: #fff;
    color: var(--brown);
    margin: 4px 0 10px;
  }
  #survey textarea { height: 190px; white-space: pre; }
  #survey button { width: 100%; margin-bottom: 8px; }
  #survey .primary { background: var(--sea); color: #fff; }
  #survey .plain   { background: transparent; color: var(--brown); box-shadow: inset 0 0 0 1.5px var(--brown); }
  #survey .quiet   { background: transparent; color: var(--gray); font-weight: 500; }
</style>

<script>
/* 改行したい位置に \n を入れると、その位置で必ず折り返します */
const TOPICS = [
  "大清水",
  "白亜紀\nダイナ荘",
  "恐竜\nマンホール",
  "消火栓モグラ",
  "恐竜ポスト",
  "七里壁",
  "入船電柱",
  "松梅"
];

/* お題ごとの現地判定。キーは TOPICS と同じ文字列にします。
   書き方は3通り。r は許容距離（m）で、省略すると DEFAULT_RADIUS になります。
     一点   { lat, lng, r }                  … 単体で建っているもの
     線     { line: [[lat,lng], …], r }      … 七里壁のように連なっているもの
     点在   { any:  [[lat,lng], …], r }      … マンホールのように何か所もあるもの
   座標が未登録のお題は判定なしで、これまで通りすぐ撮影できます。
   座標は URL の末尾に ?spots を付けて開くと、現地で記録できます。 */
const SPOTS = {
  "大清水":          { lat: 36.060301, lng: 136.497602 },
  "入船電柱":        { lat: 36.060784, lng: 136.497514 },
  "松梅":            { lat: 36.060703, lng: 136.497202 },
  "白亜紀\nダイナ荘": { lat: 36.060059, lng: 136.499091 },
  "消火栓モグラ":    { lat: 36.061901, lng: 136.498362 },
  "恐竜ポスト":      { lat: 36.058741, lng: 136.497270 },
  "恐竜\nマンホール": { any: [
    [36.059982, 136.499129], [36.059627, 136.499248], [36.059412, 136.499291],
    [36.059380, 136.499231], [36.059191, 136.498616], [36.059176, 136.498510],
    [36.059139, 136.498474], [36.059101, 136.498362], [36.060309, 136.497542],
    [36.060243, 136.497320], [36.060774, 136.496972], [36.061218, 136.496816],
    [36.060823, 136.497869], [36.060971, 136.498587], [36.061145, 136.498655],
    [36.060598, 136.498932], [36.060740, 136.497383]
  ] },
  // 七里壁は南北に長く続くので、まちあるきで通る 62m ぶんだけを線にしてある
  "七里壁": { line: [[36.060436, 136.499701], [36.059901, 136.499881]] }
};
const DEFAULT_RADIUS = 10;   // 許容距離のきほん値（m）。歩いて近づく前提の狭さ
const MAX_GPS_MARGIN = 30;   // GPS 誤差を大目に見る上限（m）
const COARSE_ACC = 100;      // これより誤差が大きいと、そもそも判定が成り立たない（m）
const GEO_TIMEOUT = 12000;

/* 保存画像で使うフォント。CSS の --ui-font と同じ並びにしてください */
const FONT_STACK = '-apple-system, BlinkMacSystemFont, "Hiragino Sans", ' +
                   '"Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", ' +
                   '"Segoe UI", Roboto, sans-serif';

/* マスの縦横比（縦 ÷ 横）。CSS の --cell-w / --cell-h と同じ値にしてください */
const CELL_RATIO = 4 / 3;

const CENTER_INDEX = 4;
const CENTER_LABEL = "発掘マス";
const TITLE = "#勝山発掘まちあるき";
const SUBTITLE = "まちの発掘拠点 IRIFUNE";
const LOGO_SRC = "logo.png";

/* IRIFUNE ブランドトークン（k-irifune.com と共通） */
const C = {
  base:  "#FFFDF3",
  brown: "#462814",
  land:  "#B0C8A4",
  sky:   "#73B4C0",
  sea:   "#4F9282",
  gray:  "#727171",
  stamp: "#C0453C"
};

const LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

/* cell = { topic, file: 撮影した元ファイル, photo: 表示用に縮小した dataURL, verified: 現地判定に合格したか } */
let cells = [];

/* ---------- 現地判定（位置情報は端末の中だけで使い、どこにも送りません） ---------- */

/* 2地点の距離をメートルで返す（球面近似） */
function distanceMeters(a, b) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

/* 狭い範囲なので、緯度経度をそのままメートルの平面に置き換えて計算する */
function toXY(p, origin) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  return {
    x: R * toRad(p.lng - origin.lng) * Math.cos(toRad(origin.lat)),
    y: R * toRad(p.lat - origin.lat)
  };
}

/* 点から線分までの最短距離。七里壁のように連なった場所で使う */
function distanceToSegment(p, a, b) {
  const A = toXY(a, p), B = toXY(b, p);   // p を原点に置く
  const vx = B.x - A.x, vy = B.y - A.y;
  const len2 = vx * vx + vy * vy;
  if (len2 === 0) return Math.hypot(A.x, A.y);
  let t = (-A.x * vx - A.y * vy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(A.x + t * vx, A.y + t * vy);
}

function distanceToSpot(pos, spot) {
  const pt = ll => ({ lat: ll[0], lng: ll[1] });
  if (spot.line && spot.line.length > 1) {
    let best = Infinity;
    for (let i = 0; i < spot.line.length - 1; i++) {
      best = Math.min(best, distanceToSegment(pos, pt(spot.line[i]), pt(spot.line[i + 1])));
    }
    return best;
  }
  const list = spot.any || spot.line || [[spot.lat, spot.lng]];
  return Math.min(...list.map(ll => distanceMeters(pos, pt(ll))));
}

function spotOf(cell) {
  return cell.isCenter ? null : (SPOTS[cell.topic] || null);
}

function currentPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error("unsupported")); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      err => reject(err),
      { enableHighAccuracy: true, timeout: GEO_TIMEOUT, maximumAge: 0 }
    );
  });
}

function formatDistance(m) {
  return m >= 1000 ? `${(m / 1000).toFixed(1)}km` : `${Math.round(m)}m`;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initCells() {
  const shuffled = shuffle(TOPICS);
  cells = [];
  let idx = 0;
  for (let i = 0; i < 9; i++) {
    if (i === CENTER_INDEX) {
      cells.push({ topic: "", file: null, photo: null, isCenter: true, verified: false });
    } else {
      cells.push({ topic: shuffled[idx++], file: null, photo: null, isCenter: false, verified: false });
    }
  }
}

function filledCount() { return cells.filter(c => c.photo).length; }
function bingoLines() { return LINES.filter(line => line.every(i => cells[i].photo)); }

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

/* 端末に保存する元画像はそのまま持ち、表示用だけ縮小してメモリを抑える */
async function toDisplayDataUrl(file, max = 1500) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(img, 0, 0, w, h);
    return cv.toDataURL("image/jpeg", 0.9);
  } finally {
    URL.revokeObjectURL(url);
  }
}

/* ---------- ロゴ ---------- */

let logoBrown = null;  /* フッター用（濃茶） */

/* 白地・濃色のロゴPNGを、明るさからアルファを起こして任意の一色に置き換える */
function tintLogo(img, r, g, b) {
  const S = 512;
  const cv = document.createElement("canvas");
  cv.width = cv.height = S;
  const x = cv.getContext("2d");
  x.drawImage(img, 0, 0, S, S);
  const d = x.getImageData(0, 0, S, S);
  const p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const lum = (p[i] * 0.299 + p[i+1] * 0.587 + p[i+2] * 0.114) / 255;
    p[i+3] = Math.round(Math.max(0, 1 - lum) * 255);
    p[i] = r; p[i+1] = g; p[i+2] = b;
  }
  x.putImageData(d, 0, 0);
  return cv;
}

/* ---------- 表示 ---------- */

let prevBingo = 0;

/* ビンゴの見出し。写真に重ねず、進捗の横に文字で添える */
function bingoLabel(lines, n) {
  if (n === 9) return "コンプリート！";
  return lines > 1 ? `${lines} LINES!` : "BINGO!";
}

function updateStatus() {
  const n = filledCount();
  document.getElementById("count").textContent = `${n} / 9 発掘`;

  const lines = bingoLines().length;
  const tag = document.getElementById("bingoTag");
  if (lines > 0) {
    tag.textContent = bingoLabel(lines, n);
    tag.hidden = false;
    if (lines > prevBingo) {
      tag.classList.remove("pop");
      void tag.offsetWidth;  // アニメを頭から再生させるためリフローを挟む
      tag.classList.add("pop");
    }
  } else {
    tag.hidden = true;
    tag.classList.remove("pop");
  }
  prevBingo = lines;
}

function render() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  cells.forEach((cell, index) => {
    const div = document.createElement("div");
    div.className = "cell" + (cell.isCenter ? " center" : "") + (cell.photo ? " has-photo" : "");

    if (cell.photo) {
      const img = document.createElement("img");
      img.src = cell.photo;
      div.appendChild(img);
    }

    if (cell.verified && cell.photo) {
      const ok = document.createElement("div");
      ok.className = "geo-ok";
      ok.textContent = "✓";
      ok.title = "現地で撮影";
      div.appendChild(ok);
    }

    if (cell.isCenter) {
      const badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = CENTER_LABEL;
      div.appendChild(badge);
    }

    if (cell.isCenter && !cell.photo) {
      const input = document.createElement("input");
      input.className = "topic-input";
      input.type = "text";
      input.placeholder = "発掘したもの";
      input.value = cell.topic;
      input.addEventListener("click", (e) => e.stopPropagation());
      input.addEventListener("input", (e) => { cell.topic = e.target.value; });
      div.appendChild(input);
    } else {
      const label = document.createElement("div");
      label.className = "topic-text";
      label.textContent = cell.topic;
      div.appendChild(label);
    }

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.capture = "environment";
    fileInput.className = "file-input";
    // プログラムから click() したとき、マス自身の click に跳ね返らないようにする
    fileInput.addEventListener("click", (e) => e.stopPropagation());
    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      let photo;
      try {
        photo = await toDisplayDataUrl(file);
      } catch {
        /* 端末が読めない形式（古い機種の HEIC など）や、壊れたデータ。
           黙って何も起きないと、参加者は原因にたどりつけない */
        alert("この写真を読み込めませんでした。\nもう一度撮影するか、別の写真をお試しください。");
        return;
      } finally {
        // 同じ写真をもう一度選んでも change が起きるようにしておく
        e.target.value = "";
      }
      cell.file = file;
      cell.photo = photo;
      render();
      // 撮った直後だけ、端末に残す機会を一度つくる
      openKeep(index);
    });
    div.appendChild(fileInput);

    // 写真がまだなら撮影へ、あるなら保存/撮り直しの選択へ。
    // 座標が登録されたお題は、先に現地かどうかを確かめる
    div.addEventListener("click", () => {
      if (cell.photo) openSheet(index);
      else if (spotOf(cell)) startGeoCheck(index);
      else fileInput.click();
    });
    div._fileInput = fileInput;

    board.appendChild(div);
  });
  updateStatus();
}

/* ---------- 現地判定ダイアログ ---------- */

let geoIndex = null;
let geoPassed = false;

/* 見出しの頭だけ朱色にする。お題名は textContent で入れる（HTML として解釈させない） */
function setGeoTitle(hit, rest) {
  const title = document.getElementById("geoTitle");
  title.textContent = "";
  if (hit) {
    const span = document.createElement("span");
    span.className = "hit";
    span.textContent = hit;
    title.appendChild(span);
  }
  title.appendChild(document.createTextNode(rest));
}

function setGeoButtons(shoot, retry, anyway) {
  document.getElementById("geoShootBtn").hidden  = !shoot;
  document.getElementById("geoRetryBtn").hidden  = !retry;
  document.getElementById("geoAnywayBtn").hidden = !anyway;
}

function closeGeo() {
  document.getElementById("geoBack").hidden = true;
  geoIndex = null;
}

function openCameraFor(index) {
  const div = document.getElementById("board").children[index];
  if (div && div._fileInput) div._fileInput.click();
}

async function runGeoCheck() {
  const index = geoIndex;
  const cell = cells[index];
  const spot = spotOf(cell);
  const name = cell.topic.replace(/\n/g, "");
  const title = document.getElementById("geoTitle");
  const note  = document.getElementById("geoNote");

  geoPassed = false;
  setGeoTitle("", `${name} を探索中…`);
  note.textContent = "現在地をたしかめています。\n屋外のほうが正確に測れます。";
  setGeoButtons(false, false, false);

  let pos;
  try {
    pos = await currentPosition();
  } catch (err) {
    if (geoIndex !== index) return;   // 待っている間に閉じられた
    setGeoTitle("", "現在地を見失いました");
    note.textContent = (err && err.code === 1)
      ? "位置情報の利用が許可されていないようです。\nブラウザの設定で許可すると、現地の判定ができます。"
      : "電波や建物の影響かもしれません。\n少し場所を移して、もう一度どうぞ。";
    setGeoButtons(false, true, true);
    return;
  }
  if (geoIndex !== index) return;

  /* 誤差が大きすぎるときは、距離を比べても意味がない。
     「近づいてもずっと接近中」になる前に、原因のほうを伝える */
  if (pos.acc && pos.acc > COARSE_ACC) {
    setGeoTitle("", "位置がぼんやりしています");
    note.textContent =
      `いまの誤差は約 ${formatDistance(pos.acc)} あります。\n` +
      "iPhone は 設定 → プライバシーとセキュリティ → 位置情報サービス → Safari で" +
      "「正確な位置情報」をオンにすると、判定できるようになります。\n" +
      "建物の中や地下でも粗くなります。";
    setGeoButtons(false, true, true);
    return;
  }

  const dist   = distanceToSpot(pos, spot);
  const radius = spot.r || DEFAULT_RADIUS;
  // GPS の誤差ぶんは大目に見る。ただし誤差が大きすぎるときは頭打ちにする
  const margin = Math.min(pos.acc || 0, MAX_GPS_MARGIN);

  if (dist - margin <= radius) {
    geoPassed = true;
    setGeoTitle("発見！ ", name);
    note.textContent = "発掘ポイントに立っています。\nさあ、記録しましょう。";
    setGeoButtons(true, false, false);
  } else {
    setGeoTitle("接近中！ ", `あと約 ${formatDistance(dist - radius)}`);
    note.textContent = `${name}は この先にあります。\n近づいたら、もう一度どうぞ。`;
    setGeoButtons(false, true, true);
  }
}

function startGeoCheck(index) {
  geoIndex = index;
  document.getElementById("geoBack").hidden = false;
  runGeoCheck();
}

/* 撮影は必ずボタンのタップから始める（iOS はユーザー操作なしにカメラを開けない） */
function shootFromGeo() {
  const i = geoIndex;
  if (geoPassed) cells[i].verified = true;
  closeGeo();
  openCameraFor(i);
}

document.getElementById("geoShootBtn").addEventListener("click", shootFromGeo);
document.getElementById("geoAnywayBtn").addEventListener("click", shootFromGeo);
document.getElementById("geoRetryBtn").addEventListener("click", runGeoCheck);
document.getElementById("geoCancelBtn").addEventListener("click", closeGeo);
document.getElementById("geoBack").addEventListener("click", (e) => {
  if (e.target.id === "geoBack") closeGeo();
});

}

});

  const div = board.children[sheetIndex];

});

/* 共有シート経由で端末に保存する。非対応環境ではダウンロードにする */
async function saveFileToDevice(file, fallbackName) {
  const data = { files: [file] };
  if (navigator.canShare && navigator.canShare(data)) {
    await navigator.share(data);
    return;
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url;
  a.download = fallbackName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.getElementById("savePhotoBtn").addEventListener("click", async () => {
  const cell = cells[sheetIndex];
  const label = (cell.topic || CENTER_LABEL).replace(/\n/g, "");
  closeSheet();
  if (!cell.file) return;
  try {
    await saveFileToDevice(cell.file, `katsuyama-${label}.jpg`);
  } catch (err) {
    if (err && err.name !== "AbortError") alert("保存できませんでした。もう一度お試しください。");
  }
});

/* ---------- はじめの案内（位置情報のこと） ----------
   ブラウザの許可ダイアログは、出たその場でしか押せません。
   何に使うのかを先に伝えておくと、とっさに「許可しない」を選ばずに済みます。
   ※ Web ページから端末の設定画面へ移動させることはできないので、
      すでに拒否されている場合は、設定の場所を文字で案内します。 */

const SETTINGS_HINT =
  "iPhone：アドレスバーの「ぁあ」→ Webサイトの設定 → 位置情報 →「確認」\n" +
  "Android：アドレスバーの鍵アイコン → 権限 → 現在地";

async function geoPermissionState() {
  if (!navigator.permissions || !navigator.permissions.query) return "unknown";
  try {
    const s = await navigator.permissions.query({ name: "geolocation" });
    return s.state;                       // granted / denied / prompt
  } catch {
    return "unknown";                     // 問い合わせ自体に未対応の端末
  }
}

function closeIntro() { document.getElementById("introBack").hidden = true; }

async function startIntro() {
  if (!navigator.geolocation) return;     // 使えない端末では黙っておく
  const state = await geoPermissionState();
  if (state === "granted") return;        // すでに許可済みなら邪魔をしない

  const title = document.getElementById("introTitle");
  const note  = document.getElementById("introNote");
  const allow = document.getElementById("introAllowBtn");
  const later = document.getElementById("introLaterBtn");

  if (state === "denied") {
    // この状態では、もう一度たずねてもブラウザのダイアログは出ない
    title.textContent = "位置情報がオフになっています";
    note.textContent =
      "お題の場所に着いたかどうかを確かめられません。\n" +
      "撮影はこのままでもできます。\n\n" + SETTINGS_HINT;
    allow.hidden = true;
    later.textContent = "このまま始める";
  } else {
    title.textContent = "位置情報を使います";
    note.textContent =
      "お題の場所に着いたかどうかを確かめるためだけに使います。\n" +
      "現在地も写真も、どこにも送りません。記録も残しません。\n\n" +
      "次に出るブラウザの確認で「許可」を選んでください。";
    allow.hidden = false;
    later.textContent = "あとで決める";
  }
  document.getElementById("introBack").hidden = false;
}

document.getElementById("introLaterBtn").addEventListener("click", closeIntro);
document.getElementById("introAllowBtn").addEventListener("click", () => {
  closeIntro();
  // ここで初めてブラウザの確認ダイアログが出る。結果はこの場では使わない
  currentPosition().catch(() => {});
});

/* ---------- 保存用のシート画像 ---------- */

function roundRectPath(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* \n で必ず改行し、それでも幅に収まらない行だけ文字単位で折り返す */
function wrapLines(ctx, text, maxWidth) {
  const lines = [];
  for (const segment of text.split("\n")) {
    let line = "";
    for (const ch of segment.split("")) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    lines.push(line);
  }
  return lines;
}

function drawCenteredText(ctx, text, cx, cy, maxWidth, lineHeight) {
  if (!text) return;
  const lines = wrapLines(ctx, text, maxWidth);
  const startY = cy - (lines.length * lineHeight) / 2 + lineHeight / 2;
  lines.forEach((l, i) => ctx.fillText(l, cx, startY + i * lineHeight));
}

function drawPhotoCover(ctx, img, x, y, w, h) {
  const imgRatio = img.width / img.height;
  const boxRatio = w / h;
  let sx, sy, sw, sh;
  if (imgRatio > boxRatio) {
    sh = img.height; sw = sh * boxRatio; sx = (img.width - sw) / 2; sy = 0;
  } else {
    sw = img.width; sh = sw / boxRatio; sx = 0; sy = (img.height - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

async function buildImage() {
  // 端末に入っているフォントだけを使うので、読み込みを待つ必要はありません

  // Instagram のフィードに収まる 4:5。この枠に合わせて盤面の大きさを決める
  const W = 1620;
  const H = Math.round(W * 5 / 4);
  const k = W / 1080;        // 従来比の拡大率
  const GAP = 12 * k;
  const HEADER = 168 * k;
  const FOOTER = 112 * k;

  const room = H - HEADER - FOOTER;          // 盤面に使える高さ
  let boxH = (room - GAP * 2) / 3;
  let boxW = boxH / CELL_RATIO;
  // 横にはみ出すなら幅のほうで決め直す（マスが横長寄りのときの保険）
  const maxBoxW = (W - 88 * k - GAP * 2) / 3;
  if (boxW > maxBoxW) { boxW = maxBoxW; boxH = boxW * CELL_RATIO; }

  const gridW = boxW * 3 + GAP * 2;
  const gridH = boxH * 3 + GAP * 2;
  const PAD = (W - gridW) / 2;               // 左右は自動で振り分ける
  const TOP = HEADER + (room - gridH) / 2;   // 余りが出たら上下にも振り分ける

  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = C.base;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // ヘッダー
  ctx.fillStyle = C.brown;
  ctx.font = `700 ${54 * k}px ${FONT_STACK}`;
  ctx.fillText(TITLE, W / 2, 62 * k);

  // 進捗バッジ。ビンゴしたら写真を隠さないよう、ここに文字で足す
  const n = filledCount();
  const lines = bingoLines().length;
  const statusText = `${n} / 9 発掘`;
  const tagText = lines > 0 ? bingoLabel(lines, n) : "";
  ctx.font = `700 ${26 * k}px ${FONT_STACK}`;
  const sw = ctx.measureText(statusText).width;
  const gapW = tagText ? 16 * k : 0;
  const tw = tagText ? ctx.measureText(tagText).width : 0;
  const bw = sw + gapW + tw + 46 * k;
  const bh = 44 * k, bx = (W - bw) / 2, by = 106 * k;
  ctx.fillStyle = C.land;
  roundRectPath(ctx, bx, by, bw, bh, bh / 2);
  ctx.fill();
  ctx.textAlign = "left";
  ctx.fillStyle = C.brown;
  ctx.fillText(statusText, bx + 23 * k, by + bh / 2 + 1);
  if (tagText) {
    ctx.fillStyle = C.stamp;
    ctx.fillText(tagText, bx + 23 * k + sw + gapW, by + bh / 2 + 1);
  }
  ctx.textAlign = "center";

  // 盤面の下地
  ctx.fillStyle = C.brown;
  roundRectPath(ctx, PAD - 9 * k, TOP - 9 * k, gridW + 18 * k, gridH + 18 * k, 20 * k);
  ctx.fill();

  const imgs = await Promise.all(cells.map(c => c.photo ? loadImage(c.photo) : null));

  cells.forEach((cell, i) => {
    const x = PAD + (i % 3) * (boxW + GAP);
    const y = TOP + Math.floor(i / 3) * (boxH + GAP);
    const img = imgs[i];

    ctx.save();
    roundRectPath(ctx, x, y, boxW, boxH, 12 * k);
    ctx.clip();

    if (img) {
      drawPhotoCover(ctx, img, x, y, boxW, boxH);
      const bandH = 64 * k;
      const grad = ctx.createLinearGradient(0, y + boxH - bandH, 0, y + boxH);
      grad.addColorStop(0, "rgba(70,40,20,0)");
      grad.addColorStop(1, "rgba(70,40,20,0.93)");
      ctx.fillStyle = grad;
      ctx.fillRect(x, y + boxH - bandH, boxW, bandH);
      ctx.fillStyle = C.base;
      ctx.font = `500 ${21 * k}px ${FONT_STACK}`;
      drawCenteredText(ctx, cell.topic || CENTER_LABEL, x + boxW / 2, y + boxH - 26 * k, boxW - 20 * k, 24 * k);
    } else {
      ctx.fillStyle = cell.isCenter ? C.land : C.base;
      ctx.fillRect(x, y, boxW, boxH);
      ctx.fillStyle = C.brown;
      ctx.font = `500 ${26 * k}px ${FONT_STACK}`;
      drawCenteredText(ctx, cell.topic || (cell.isCenter ? CENTER_LABEL : ""), x + boxW / 2, y + boxH / 2, boxW - 34 * k, 34 * k);
    }
    ctx.restore();
  });

  // フッター（ハッシュタグはタイトルと重複するので置かない）
  const d = new Date();
  const dateStr = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
  const fy = TOP + gridH;

  ctx.fillStyle = C.gray;
  ctx.font = `500 ${23 * k}px ${FONT_STACK}`;
  ctx.fillText(`${dateStr}　福井県勝山市`, W / 2, fy + 42 * k);

  // ロゴ＋ハウスネームを最下部に置く
  ctx.fillStyle = C.brown;
  ctx.font = `500 ${24 * k}px ${FONT_STACK}`;
  const houseText = SUBTITLE;
  const logoSize = 34 * k;
  const textW = ctx.measureText(houseText).width;
  const totalW = (logoBrown ? logoSize + 12 * k : 0) + textW;
  const startX = (W - totalW) / 2;
  const houseY = fy + 88 * k;
  if (logoBrown) {
    ctx.drawImage(logoBrown, startX, houseY - logoSize / 2, logoSize, logoSize);
  }
  ctx.textAlign = "left";
  ctx.fillText(houseText, startX + (logoBrown ? logoSize + 12 * k : 0), houseY);
  ctx.textAlign = "center";

  return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.92));
}

/* 保存メニュー */

function photoLabel(cell) {
  return (cell.topic || CENTER_LABEL).replace(/\n/g, "");
}

document.getElementById("saveBtn").addEventListener("click", () => {
  const shot = cells.filter(c => c.file).length;
  const allBtn = document.getElementById("saveAllBtn");
  allBtn.textContent = `撮った写真をまとめて保存（${shot}枚）`;
  allBtn.disabled = shot === 0;
  allBtn.style.opacity = shot === 0 ? 0.4 : 1;
  document.getElementById("saveBack").hidden = false;
});

function closeSaveMenu() { document.getElementById("saveBack").hidden = true; }
document.getElementById("saveCancelBtn").addEventListener("click", closeSaveMenu);
document.getElementById("saveBack").addEventListener("click", (e) => {
  if (e.target.id === "saveBack") closeSaveMenu();
});

/* 撮影した元画像をまとめて共有シートへ渡す */
document.getElementById("saveAllBtn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  const files = cells
    .filter(c => c.file)
    .map(c => new File([c.file], `katsuyama-${photoLabel(c)}.jpg`, { type: c.file.type || "image/jpeg" }));
  if (!files.length) return;

  closeSaveMenu();
  try {
    const data = { files };
    if (navigator.canShare && navigator.canShare(data)) {
      await navigator.share(data);
      return;
    }
    // 共有APIが使えない環境では1枚ずつダウンロードする
    for (const f of files) {
      const url = URL.createObjectURL(f);
      const a = document.createElement("a");
      a.href = url;
      a.download = f.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      await new Promise(r => setTimeout(r, 300));
    }
  } catch (err) {
    if (err && err.name !== "AbortError") alert("保存できませんでした。もう一度お試しください。");
  }
});

document.getElementById("saveSheetBtn").addEventListener("click", async () => {
  const btn = document.getElementById("saveBtn");
  const original = btn.textContent;
  closeSaveMenu();
  btn.disabled = true;
  btn.textContent = "作成中...";
  try {
    const blob = await buildImage();
    const file = new File([blob], "katsuyama-hakkutsu.jpg", { type: "image/jpeg" });
    const shareData = { files: [file], text: `勝山のまちを発掘してきた！\n${TITLE} #IRIFUNE #福井県勝山市` };
    if (navigator.canShare && navigator.canShare(shareData)) {
      await navigator.share(shareData);
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.download = "katsuyama-hakkutsu.jpg";
      a.href = url;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  } catch (err) {
    if (err && err.name !== "AbortError") alert("画像の保存に失敗しました。もう一度お試しください。");
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("お題をシャッフルして写真をすべて消去します。よろしいですか？")) {
    initCells();
    render();
  }
});

/* ---------- 座標の下見モード（URL の末尾に ?spots を付けると開く） ----------
   現地に立って「この地点を記録」を押すと、SPOTS に貼り付けるコードができあがります。 */
function startSurvey() {
  const panel = document.getElementById("survey");
  panel.hidden = false;
  panel.innerHTML =
    '<h2>座標の下見モード</h2>' +
    '<p>お題の場所に立って「この地点を記録」を押してください。' +
    'できあがったコードを index.html の <code>SPOTS</code> に貼り付けます。</p>' +
    '<div class="now" id="svNow">現在地を取得中…</div>' +
    '<select id="svSel"></select>' +
    '<select id="svKind">' +
      '<option value="point">一点だけの場所</option>' +
      '<option value="line">連なった場所（両端を記録）</option>' +
      '<option value="any">点在する場所（一つずつ記録）</option>' +
    '</select>' +
    '<button class="primary" id="svRec">この地点を記録</button>' +
    '<button class="plain" id="svUndo">このお題の記録を消す</button>' +
    '<textarea id="svOut" readonly></textarea>' +
    '<button class="plain" id="svCopy">コードをコピー</button>' +
    '<button class="quiet" id="svClose">ビンゴに戻る</button>';

  const sel = document.getElementById("svSel");
  TOPICS.forEach(t => {
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t.replace(/\n/g, "");
    sel.appendChild(o);
  });

  let here = null;
  const recorded = {};   /* お題 → { kind, points: [{lat,lng}, …] } */
  const six = v => v.toFixed(6);

  const paint = () => {
    const rows = Object.keys(recorded).map(t => {
      const { kind, points } = recorded[t];
      const list = points.map(p => `[${six(p.lat)}, ${six(p.lng)}]`).join(", ");
      const body = (kind === "point" || points.length === 1) && kind !== "line"
        ? `{ lat: ${six(points[0].lat)}, lng: ${six(points[0].lng)} }`
        : `{ ${kind}: [${list}] }`;
      return `  ${JSON.stringify(t)}: ${body},`;
    });
    document.getElementById("svOut").value =
      "const SPOTS = {" + (rows.length ? "\n" + rows.join("\n") + "\n" : "") + "};";
  };
  paint();

  navigator.geolocation.watchPosition(p => {
    here = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
    document.getElementById("svNow").textContent =
      `${here.lat.toFixed(6)}, ${here.lng.toFixed(6)}（誤差 約${Math.round(here.acc)}m）`;
  }, err => {
    document.getElementById("svNow").textContent = `取得できません（${err.message}）`;
  }, { enableHighAccuracy: true, maximumAge: 0 });

  document.getElementById("svRec").addEventListener("click", () => {
    if (!here) { alert("まだ現在地を取得できていません。"); return; }
    const kind = document.getElementById("svKind").value;
    const entry = recorded[sel.value];
    // 一点なら上書き、線と点在なら押すたびに足していく
    if (!entry || entry.kind !== kind || kind === "point") {
      recorded[sel.value] = { kind, points: [{ lat: here.lat, lng: here.lng }] };
    } else {
      entry.points.push({ lat: here.lat, lng: here.lng });
    }
    paint();
  });
  document.getElementById("svUndo").addEventListener("click", () => {
    delete recorded[sel.value];
    paint();
  });
  document.getElementById("svCopy").addEventListener("click", async () => {
    const text = document.getElementById("svOut").value;
    try { await navigator.clipboard.writeText(text); alert("コピーしました。"); }
    catch { alert("コピーできませんでした。手動で選択してください。"); }
  });
  document.getElementById("svClose").addEventListener("click", () => { panel.hidden = true; });
}

initCells();
render();

if (location.search.includes("spots")) startSurvey();
else startIntro();   // 下見モードのときは案内を出さない

loadImage(LOGO_SRC).then(img => {
  logoBrown = tintLogo(img, 0x46, 0x28, 0x14);
}).catch(() => { /* ロゴが無くてもフッターは成立する */ });
</script>
